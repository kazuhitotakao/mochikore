name: Mochikore CI

on:
  pull_request:
    branches: [develop, main]
    # ラベルの付け外しではテストを動かさない。自動マージの予約は auto-merge.yml で行う
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # PRでは取り消さない。PR作成とラベル付けで続けて実行されたとき、取り消された回のチェックが残り、
  # 成功した回があってもPRが失敗扱いでマージされないことがあったため（PR #8）。
  # pushでは従来どおり、古い実行を取り消す
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: Prettier
        run: npx prettier --check .

      # LayoutPropsなどの型は.next/typesに生成される。CIには開発サーバーの生成物がないため、先に生成する
      - name: Type check
        run: npx next typegen && npx tsc --noEmit

      - name: Build
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mochikore_test
          MYSQL_USER: mochikore
          MYSQL_PASSWORD: ci_password
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # CIの中だけで使う一時的なDB。開発用・本番用の値ではない
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: mochikore_test
      DB_USERNAME: mochikore
      DB_PASSWORD: ci_password
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, zip, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: Tests
        run: php artisan test

  # 自動マージの予約（auto-merge.yml）だけだと、チェックの成功からGitHubがマージするまで
  # 2分ほど待つことがある（PR #11）。チェックが通った時点でここからマージし、待ち時間をなくす。
  # 条件は auto-merge.yml と同じ。ラベルは、CIの途中で付けた場合も拾えるよう、この時点のものを確かめる
  merge-after-checks:
    name: Merge after checks (opt-in)
    needs: [frontend, backend]
    if: >-
      ${{ vars.ENABLE_AUTO_MERGE == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'develop' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login == github.repository_owner &&
          github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the checked head and delete the branch if the automerge label is set
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # チェックしたコミットが今も先頭のときだけマージする（--match-head-commit）。
        # マージできない状態なら、--auto により予約のまま残り、条件がそろった時点でGitHubがマージする。
        # GitHub Actionsのトークンでのマージでは、リポジトリ設定（Automatically delete head branches）が
        # 効かないため、ここで --delete-branch によりブランチを消す
        run: |
          labels=$(gh pr view "$PR_URL" --repo "$GH_REPO" --json labels --jq '.labels[].name')
          if ! grep -qx automerge <<< "$labels"; then
            echo "automerge ラベルがないので、マージしない"
            exit 0
          fi
          gh pr merge "$PR_URL" --repo "$GH_REPO" --auto --squash --match-head-commit "$PR_HEAD_SHA" --delete-branch
